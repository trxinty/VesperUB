<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Neon Pong · Vesper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#07050c;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas{display:block;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.28);max-width:100%;max-height:100%;}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,9,20,0.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:10;}
.hud span b{color:#c4b5fd;}
.overlay{position:fixed;inset:0;background:rgba(6,4,10,0.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center;padding:24px;}
.overlay.hidden{display:none;}
.overlay h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#c4b5fd,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.overlay p{color:#a79ec0;max-width:360px;font-size:0.95rem;line-height:1.5;}
.btn{background:#8b5cf6;color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:0.9rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,0.35);transition:transform 0.14s,background 0.14s;}
.btn:hover{background:#7c3aed;transform:translateY(-1px);}
.btn.sec{background:#1b1429;border:1px solid rgba(255,255,255,0.14);box-shadow:none;}
.btn.active{background:#c084fc;color:#09060e;}
</style>
</head>
<body>
<div class="hud"><span>P1 <b id="p1">0</b></span><span>VS</span><span>P2/AI <b id="p2">0</b></span></div>
<canvas id="c" width="780" height="460"></canvas>
<div class="overlay" id="ov"><h1>NEON PONG</h1><p>P1 uses <strong>W / S</strong> (or Touch/Mouse). In 2P mode, P2 uses <strong>Up / Down</strong>.</p><div style="display:flex;gap:10px;"><button class="btn" id="aiBtn">1P vs AI</button><button class="btn sec" id="twoBtn">2P Local</button></div></div>
<script>

const c=document.getElementById('c'),ctx=c.getContext('2d'),ov=document.getElementById('ov');
let run=false,twoP=false,s1=0,s2=0,p1={y:185,h:90},p2={y:185,h:90},b={x:390,y:230,vx:5.4,vy:3.2},keys={};
function resetBall(dir){ b={x:c.width/2,y:c.height/2,vx:dir*5.5,vy:(Math.random()-0.5)*6}; }
function start(is2p){ twoP=is2p; s1=0; s2=0; p1.y=185; p2.y=185; sync(); resetBall(1); run=true; ov.classList.add('hidden'); }
function sync(){ document.getElementById('p1').textContent=s1; document.getElementById('p2').textContent=s2; }
window.addEventListener('keydown',e=>keys[e.code]=true);
window.addEventListener('keyup',e=>keys[e.code]=false);
c.addEventListener('pointermove',e=>{ if(!run||twoP)return; const r=c.getBoundingClientRect(); p1.y=Math.max(0,Math.min(c.height-p1.h,(e.clientY-r.top)*(c.height/r.height)-p1.h/2)); });
document.getElementById('aiBtn').onclick=()=>start(false);
document.getElementById('twoBtn').onclick=()=>start(true);

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle='#080510'; ctx.fillRect(0,0,c.width,c.height);
  ctx.setLineDash([8,10]); ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.moveTo(c.width/2,0); ctx.lineTo(c.width/2,c.height); ctx.stroke(); ctx.setLineDash([]);
  if(run){
    if(keys.KeyW) p1.y=Math.max(0,p1.y-7);
    if(keys.KeyS) p1.y=Math.min(c.height-p1.h,p1.y+7);
    if(twoP){
      if(keys.ArrowUp) p2.y=Math.max(0,p2.y-7);
      if(keys.ArrowDown) p2.y=Math.min(c.height-p2.h,p2.y+7);
    }else{
      const target=b.y-p2.h/2; p2.y+=Math.max(-5.2,Math.min(5.2,(target-p2.y)*0.12));
      p2.y=Math.max(0,Math.min(c.height-p2.h,p2.y));
    }
    b.x+=b.vx; b.y+=b.vy;
    if(b.y<8||b.y>c.height-8) b.vy*=-1;
    if(b.x<34&&b.x>18&&b.y>p1.y&&b.y<p1.y+p1.h&&b.vx<0){ b.vx=-b.vx*1.05; b.vy=((b.y-(p1.y+p1.h/2))/(p1.h/2))*6.5; }
    if(b.x>c.width-34&&b.x<c.width-18&&b.y>p2.y&&b.y<p2.y+p2.h&&b.vx>0){ b.vx=-b.vx*1.05; b.vy=((b.y-(p2.y+p2.h/2))/(p2.h/2))*6.5; }
    if(b.x<0){ s2++; sync(); resetBall(1); }
    if(b.x>c.width){ s1++; sync(); resetBall(-1); }
    if(s1>=7||s2>=7){
      run=false; ov.querySelector('h1').textContent=s1>=7?'PLAYER 1 WINS!':(twoP?'PLAYER 2 WINS!':'AI WINS!');
      ov.querySelector('p').textContent=`Final Score: ${s1} — ${s2}`; ov.classList.remove('hidden');
    }
  }
  ctx.fillStyle='#a855f7'; ctx.fillRect(20,p1.y,14,p1.h);
  ctx.fillStyle='#38bdf8'; ctx.fillRect(c.width-34,p2.y,14,p2.h);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,9,0,Math.PI*2); ctx.fill();
}
loop();

</script>
</body>
</html>
