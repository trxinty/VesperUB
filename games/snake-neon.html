<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Neon Snake · Vesper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#07050c;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas{display:block;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.28);max-width:100%;max-height:100%;}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,9,20,0.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:10;}
.hud span b{color:#c4b5fd;}
.overlay{position:fixed;inset:0;background:rgba(6,4,10,0.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center;padding:24px;}
.overlay.hidden{display:none;}
.overlay h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#c4b5fd,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.overlay p{color:#a79ec0;max-width:360px;font-size:0.95rem;line-height:1.5;}
.btn{background:#8b5cf6;color:#fff;border:none;padding:12px 26px;border-radius:12px;font-size:0.95rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,0.4);transition:transform 0.14s,background 0.14s;}
.btn:hover{background:#7c3aed;transform:translateY(-1px);}
.btn.sec{background:#1b1429;border:1px solid rgba(255,255,255,0.14);box-shadow:none;}
</style>
</head>
<body>
<div class="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">0</b></span></div>
<canvas id="c" width="480" height="480"></canvas>
<div class="overlay" id="ov"><h1>NEON SNAKE</h1><p>Use <strong>WASD / Arrow Keys</strong> or swipe to grow your glowing cyber-snake.</p><button class="btn" id="sbtn">Start</button></div>
<script>

const c=document.getElementById('c'),ctx=c.getContext('2d'),ov=document.getElementById('ov');
const scEl=document.getElementById('sc'),bsEl=document.getElementById('bs');
const G=24, S=20;
let best=+(localStorage.getItem('vg_snake_best')||0); bsEl.textContent=best;
let snake=[],dir={x:1,y:0},nextDir={x:1,y:0},food={x:12,y:10},score=0,timer=null;

function start(){
  snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];
  dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; scEl.textContent=0;
  placeFood(); ov.classList.add('hidden');
  clearInterval(timer); timer=setInterval(step,95);
}
function placeFood(){
  do{ food={x:Math.floor(Math.random()*S),y:Math.floor(Math.random()*S)}; }
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function step(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=S||head.y<0||head.y>=S||snake.some(s=>s.x===head.x&&s.y===head.y)){
    clearInterval(timer);
    if(score>best){best=score;localStorage.setItem('vg_snake_best',best);bsEl.textContent=best;}
    ov.querySelector('h1').textContent='GAME OVER';
    ov.querySelector('p').innerHTML=`Score: <strong>${score}</strong> · Best: <strong>${best}</strong>`;
    document.getElementById('sbtn').textContent='Play Again';
    ov.classList.remove('hidden'); return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){ score+=10; scEl.textContent=score; placeFood(); }
  else snake.pop();
  draw();
}
function draw(){
  ctx.fillStyle='#090611'; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='rgba(139,92,246,0.08)';
  for(let i=0;i<=S;i++){ctx.beginPath();ctx.moveTo(i*G,0);ctx.lineTo(i*G,c.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*G);ctx.lineTo(c.width,i*G);ctx.stroke();}
  ctx.fillStyle='#f43f5e'; ctx.shadowColor='#f43f5e'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(food.x*G+G/2,food.y*G+G/2,G*0.36,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?'#d8b4fe':'#8b5cf6';
    ctx.fillRect(s.x*G+2,s.y*G+2,G-4,G-4);
  });
}
window.addEventListener('keydown',e=>{
  const map={ArrowUp:{x:0,y:-1},KeyW:{x:0,y:-1},ArrowDown:{x:0,y:1},KeyS:{x:0,y:1},ArrowLeft:{x:-1,y:0},KeyA:{x:-1,y:0},ArrowRight:{x:1,y:0},KeyD:{x:1,y:0}}[e.code];
  if(map && (map.x!==-dir.x||map.y!==-dir.y)){ e.preventDefault(); nextDir=map; }
});
let sx=0,sy=0;
c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
c.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  const cand=Math.abs(dx)>Math.abs(dy)?(dx>0?{x:1,y:0}:{x:-1,y:0}):(dy>0?{x:0,y:1}:{x:0,y:-1});
  if(cand.x!==-dir.x||cand.y!==-dir.y) nextDir=cand;
});
document.getElementById('sbtn').onclick=start;
draw();

</script>
</body>
</html>
