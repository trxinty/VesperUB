<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Brick Breaker · Vesper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#07050c;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas{display:block;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.28);max-width:100%;max-height:100%;}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,9,20,0.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:10;}
.hud span b{color:#c4b5fd;}
.overlay{position:fixed;inset:0;background:rgba(6,4,10,0.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center;padding:24px;}
.overlay.hidden{display:none;}
.overlay h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#c4b5fd,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.overlay p{color:#a79ec0;max-width:360px;font-size:0.95rem;line-height:1.5;}
.btn{background:#8b5cf6;color:#fff;border:none;padding:12px 26px;border-radius:12px;font-size:0.95rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,0.4);transition:transform 0.14s,background 0.14s;}
.btn:hover{background:#7c3aed;transform:translateY(-1px);}
.btn.sec{background:#1b1429;border:1px solid rgba(255,255,255,0.14);box-shadow:none;}
</style>
</head>
<body>
<div class="hud"><span>Score <b id="sc">0</b></span><span>Lives <b id="lv">3</b></span><span>Level <b id="st">1</b></span></div>
<canvas id="c" width="760" height="500"></canvas>
<div class="overlay" id="ov"><h1>BRICK BREAKER</h1><p>Move your touchpad, mouse, or finger to bounce the plasma orb and shatter every neon brick.</p><button class="btn" id="sbtn">Launch</button></div>
<script>

const c=document.getElementById('c'),ctx=c.getContext('2d'),ov=document.getElementById('ov');
let run=false,score=0,lives=3,level=1,paddle={x:320,w:120,h:14},ball={x:380,y:420,vx:4.5,vy:-4.8,r:9},bricks=[];
const COLS=['#ef4444','#f97316','#facc15','#10b981','#3b82f6','#a855f7'];
function buildLevel(){
  bricks=[];
  const rows=Math.min(7,4+level), cols=10, bw=66, bh=22, gap=6, offX=(c.width-(cols*(bw+gap)-gap))/2;
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++) bricks.push({x:offX+k*(bw+gap),y:64+r*(bh+gap),w:bw,h:bh,hp:r<2&&level>1?2:1,col:COLS[r%COLS.length]});
}
function resetBall(){ ball={x:paddle.x+paddle.w/2,y:445,vx:(Math.random()<0.5?-1:1)*(4.2+level*0.4),vy:-(4.6+level*0.4),r:9}; }
function start(){ score=0; lives=3; level=1; paddle.x=320; buildLevel(); resetBall(); run=true; syncHud(); ov.classList.add('hidden'); }
function syncHud(){ document.getElementById('sc').textContent=score; document.getElementById('lv').textContent=lives; document.getElementById('st').textContent=level; }
c.addEventListener('pointermove',e=>{ const r=c.getBoundingClientRect(); paddle.x=Math.max(0,Math.min(c.width-paddle.w,(e.clientX-r.left)*(c.width/r.width)-paddle.w/2)); });
let keys={}; window.addEventListener('keydown',e=>keys[e.code]=true); window.addEventListener('keyup',e=>keys[e.code]=false);
document.getElementById('sbtn').onclick=start;

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle='#090612'; ctx.fillRect(0,0,c.width,c.height);
  if(run){
    if(keys.ArrowLeft||keys.KeyA) paddle.x=Math.max(0,paddle.x-8);
    if(keys.ArrowRight||keys.KeyD) paddle.x=Math.min(c.width-paddle.w,paddle.x+8);
    ball.x+=ball.vx; ball.y+=ball.vy;
    if(ball.x<ball.r||ball.x>c.width-ball.r) ball.vx*=-1;
    if(ball.y<ball.r) ball.vy*=-1;
    if(ball.y+ball.r>=460 && ball.y-ball.r<=460+paddle.h && ball.x>=paddle.x && ball.x<=paddle.x+paddle.w && ball.vy>0){
      const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      ball.vx=hit*6.5; ball.vy=-Math.abs(ball.vy);
    }
    for(let i=bricks.length-1;i>=0;i--){
      const b=bricks[i];
      if(ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
        ball.vy*=-1; b.hp--; score+=15; syncHud();
        if(b.hp<=0) bricks.splice(i,1);
        break;
      }
    }
    if(!bricks.length){ level++; buildLevel(); resetBall(); syncHud(); }
    if(ball.y>c.height+20){
      lives--; syncHud();
      if(lives<=0){ run=false; ov.querySelector('h1').textContent='GAME OVER'; ov.querySelector('p').textContent=`Final Score: ${score} · Level ${level}`; document.getElementById('sbtn').textContent='Play Again'; ov.classList.remove('hidden'); }
      else resetBall();
    }
  }
  bricks.forEach(b=>{ ctx.fillStyle=b.col; ctx.fillRect(b.x,b.y,b.w,b.h); if(b.hp>1){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);} });
  ctx.fillStyle='#c084fc'; ctx.shadowColor='#8b5cf6'; ctx.shadowBlur=14; ctx.fillRect(paddle.x,460,paddle.w,paddle.h); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
}
loop();

</script>
</body>
</html>
