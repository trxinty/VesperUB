<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Word Pulse · Vesper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#07050c;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas{display:block;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.28);max-width:100%;max-height:100%;}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,9,20,0.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:10;}
.hud span b{color:#c4b5fd;}
.overlay{position:fixed;inset:0;background:rgba(6,4,10,0.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center;padding:24px;}
.overlay.hidden{display:none;}
.overlay h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#c4b5fd,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.overlay p{color:#a79ec0;max-width:360px;font-size:0.95rem;line-height:1.5;}
.btn{background:#8b5cf6;color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:0.9rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,0.35);transition:transform 0.14s,background 0.14s;}
.btn:hover{background:#7c3aed;transform:translateY(-1px);}
.btn.sec{background:#1b1429;border:1px solid rgba(255,255,255,0.14);box-shadow:none;}
.btn.active{background:#c084fc;color:#09060e;}
.rows{display:grid;gap:6px;margin-top:46px;}.row{display:grid;grid-template-columns:repeat(5,48px);gap:6px;}
    .tile{height:48px;border-radius:10px;border:2px solid rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:800;text-transform:uppercase;background:#120d1d;}
    .tile.g{background:#16a34a;border-color:#16a34a;}.tile.y{background:#ca8a04;border-color:#ca8a04;}.tile.x{background:#272235;border-color:#272235;color:#94a3b8;}
    .kbd{display:flex;flex-direction:column;gap:5px;margin-top:14px;}.krow{display:flex;justify-content:center;gap:4px;}
    .key{padding:10px 9px;min-width:30px;border-radius:8px;background:#1f1730;color:#fff;border:none;font-weight:700;font-size:0.8rem;cursor:pointer;}
    .key.g{background:#16a34a;}.key.y{background:#ca8a04;}.key.x{background:#13101c;color:#64748b;}
    .msg{height:22px;margin-top:10px;font-size:0.86rem;font-weight:700;color:#c4b5fd;}</style>
</head>
<body>
<div class="hud"><span>Streak <b id="st">0</b></span><span>Word Pulse Unlimited</span></div>
<div class="rows" id="rows"></div>
<div class="msg" id="msg"></div>
<div class="kbd" id="kbd"></div>
<script>

const WORDS=['SLATE','CRANE','SPARK','GHOST','BLAZE','PRISM','ORBIT','FROST','NEXUS','VAPOR','QUEST','LASER','STORM','PIXEL','CYBER','DRIFT','CROWN','SWIFT','SHARD','FLAME','PULSE','TITAN','LUNAR','MAGIC','SONIC','BRAVE','GLIDE','HYPER','NOVEL','SOLAR','VALOR','CHESS','DREAM','EMBER','FORGE','LIGHT','MIRTH','NIGHT','OCEAN','POWER','RIVER','SHADE','TIGER','UNITY','VIVID','WRATH','ZEBRA','AUDIO','CLOUD','DELTA','EAGLE','FAITH','GIANT','HEART','IVORY','JOKER','KNIFE','LEMON','MANGO','NOBLE'];
const KB=['QWERTYUIOP','ASDFGHJKL','↵ZXCVBNM⌫'];
let target='',guesses=[],cur='',over=false,streak=+(localStorage.getItem('vg_word_streak')||0),keyState={};
document.getElementById('st').textContent=streak;

function newWord(){
  target=WORDS[Math.floor(Math.random()*WORDS.length)];
  guesses=[]; cur=''; over=false; keyState={};
  document.getElementById('msg').textContent='';
  draw();
}
function scoreWord(g){
  const res=Array(5).fill('x'), t=target.split('');
  for(let i=0;i<5;i++) if(g[i]===t[i]){res[i]='g';t[i]=null;}
  for(let i=0;i<5;i++) if(res[i]==='x'){const j=t.indexOf(g[i]);if(j>=0){res[i]='y';t[j]=null;}}
  return res;
}
function submit(){
  if(over||cur.length<5)return;
  const sc=scoreWord(cur);
  guesses.push({w:cur,sc});
  for(let i=0;i<5;i++){
    const ch=cur[i], st=sc[i];
    if(st==='g'||(st==='y'&&keyState[ch]!=='g')||!keyState[ch]) keyState[ch]=st;
  }
  if(cur===target){
    over=true; streak++; localStorage.setItem('vg_word_streak',streak); document.getElementById('st').textContent=streak;
    document.getElementById('msg').innerHTML=`Nice! Solved "${target}" — <a href="#" id="nxt" style="color:#fff;">Next Word</a>`;
  }else if(guesses.length>=6){
    over=true; streak=0; localStorage.setItem('vg_word_streak',0); document.getElementById('st').textContent=0;
    document.getElementById('msg').innerHTML=`Word was <strong>${target}</strong> — <a href="#" id="nxt" style="color:#fff;">Try Another</a>`;
  }
  cur=''; draw();
  const nxt=document.getElementById('nxt'); if(nxt) nxt.onclick=e=>{e.preventDefault();newWord();};
}
function press(k){
  if(over){if(k==='↵')newWord();return;}
  if(k==='⌫') cur=cur.slice(0,-1);
  else if(k==='↵') submit();
  else if(/^[A-Z]$/.test(k)&&cur.length<5) cur+=k;
  draw();
}
function draw(){
  const rEl=document.getElementById('rows'); rEl.innerHTML='';
  for(let r=0;r<6;r++){
    const row=document.createElement('div'); row.className='row';
    for(let c=0;c<5;c++){
      const t=document.createElement('div'); t.className='tile';
      if(r<guesses.length){ t.textContent=guesses[r].w[c]; t.classList.add(guesses[r].sc[c]); }
      else if(r===guesses.length){ t.textContent=cur[c]||''; }
      row.appendChild(t);
    }
    rEl.appendChild(row);
  }
  const kEl=document.getElementById('kbd'); kEl.innerHTML='';
  KB.forEach(line=>{
    const kr=document.createElement('div'); kr.className='krow';
    [...line].forEach(ch=>{
      const b=document.createElement('button'); b.className='key'+(keyState[ch]?' '+keyState[ch]:'');
      b.textContent=ch==='↵'?'ENTER':ch; b.onclick=()=>press(ch); kr.appendChild(b);
    });
    kEl.appendChild(kr);
  });
}
window.addEventListener('keydown',e=>{
  if(e.key==='Enter') press('↵');
  else if(e.key==='Backspace') press('⌫');
  else if(/^[a-zA-Z]$/.test(e.key)) press(e.key.toUpperCase());
});
newWord();

</script>
</body>
</html>
