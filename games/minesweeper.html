<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Minesweeper · Vesper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#07050c;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas{display:block;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.28);max-width:100%;max-height:100%;}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,9,20,0.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:10;}
.hud span b{color:#c4b5fd;}
.overlay{position:fixed;inset:0;background:rgba(6,4,10,0.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center;padding:24px;}
.overlay.hidden{display:none;}
.overlay h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#c4b5fd,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.overlay p{color:#a79ec0;max-width:360px;font-size:0.95rem;line-height:1.5;}
.btn{background:#8b5cf6;color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:0.9rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,0.35);transition:transform 0.14s,background 0.14s;}
.btn:hover{background:#7c3aed;transform:translateY(-1px);}
.btn.sec{background:#1b1429;border:1px solid rgba(255,255,255,0.14);box-shadow:none;}
.btn.active{background:#c084fc;color:#09060e;}
.grid{display:grid;gap:4px;background:#120d1d;padding:10px;border-radius:14px;border:1px solid rgba(139,92,246,0.3);margin-top:46px;}
    .sq{width:34px;height:34px;border-radius:7px;background:#24193b;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;cursor:pointer;}
    .sq.open{background:#0c0814;border-color:rgba(255,255,255,0.04);cursor:default;}
    .sq.mine{background:#ef4444;color:#fff;}
    .bar{display:flex;gap:8px;margin-top:14px;}</style>
</head>
<body>
<div class="hud"><span>Mines <b id="mn">15</b></span><span>Time <b id="tm">0</b>s</span></div>
<div class="grid" id="grid"></div>
<div class="bar"><button class="btn sec" id="flagBtn">🚩 Flag Mode: OFF</button><button class="btn" id="newBtn">Reset</button></div>
<div class="overlay hidden" id="ov"><h1 id="ovH">BOOM!</h1><p id="ovP"></p><button class="btn" id="rBtn">Play Again</button></div>
<script>

const N=10, MINES=15;
const NUMCOLS=['','#38bdf8','#34d399','#f87171','#c084fc','#fbbf24','#2dd4bf','#f472b6','#fff'];
let cells=[],over=false,flagMode=false,sec=0,tmr=null,started=false;
const gridEl=document.getElementById('grid'); gridEl.style.gridTemplateColumns=`repeat(${N},34px)`;

function init(){
  clearInterval(tmr); sec=0; started=false; over=false;
  document.getElementById('tm').textContent=0; document.getElementById('mn').textContent=MINES;
  document.getElementById('ov').classList.add('hidden');
  cells=Array.from({length:N*N},()=>({mine:false,open:false,flag:false,n:0}));
  let placed=0;
  while(placed<MINES){ const i=Math.floor(Math.random()*N*N); if(!cells[i].mine){cells[i].mine=true;placed++;} }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    let cnt=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N&&cells[nr*N+nc].mine) cnt++;
    }
    cells[r*N+c].n=cnt;
  }
  render();
}
function reveal(idx){
  if(over||cells[idx].open||cells[idx].flag)return;
  if(!started){started=true;tmr=setInterval(()=>{sec++;document.getElementById('tm').textContent=sec;},1000);}
  const cell=cells[idx]; cell.open=true;
  if(cell.mine){
    over=true; clearInterval(tmr);
    cells.forEach(c=>{if(c.mine)c.open=true;});
    render();
    document.getElementById('ovH').textContent='BOOM!';
    document.getElementById('ovP').textContent=`You hit a mine after ${sec}s.`;
    document.getElementById('ov').classList.remove('hidden'); return;
  }
  if(cell.n===0){
    const r=Math.floor(idx/N),c=idx%N;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N) reveal(nr*N+nc);
    }
  }
  const safeLeft=cells.filter(c=>!c.mine&&!c.open).length;
  if(safeLeft===0){
    over=true; clearInterval(tmr);
    document.getElementById('ovH').textContent='CLEARED!';
    document.getElementById('ovP').textContent=`Board swept in ${sec}s!`;
    document.getElementById('ov').classList.remove('hidden');
  }
  render();
}
function toggleFlag(idx){
  if(over||cells[idx].open)return;
  cells[idx].flag=!cells[idx].flag;
  document.getElementById('mn').textContent=MINES-cells.filter(c=>c.flag).length;
  render();
}
function render(){
  gridEl.innerHTML='';
  cells.forEach((cell,idx)=>{
    const d=document.createElement('button'); d.className='sq'+(cell.open?' open':'')+(cell.open&&cell.mine?' mine':'');
    if(cell.open){
      d.textContent=cell.mine?'💣':(cell.n||'');
      if(!cell.mine&&cell.n) d.style.color=NUMCOLS[cell.n];
    }else if(cell.flag){ d.textContent='🚩'; }
    d.onclick=()=>{ if(flagMode)toggleFlag(idx); else reveal(idx); };
    d.oncontextmenu=e=>{e.preventDefault();toggleFlag(idx);};
    gridEl.appendChild(d);
  });
}
document.getElementById('flagBtn').onclick=e=>{flagMode=!flagMode;e.target.textContent=`🚩 Flag Mode: ${flagMode?'ON':'OFF'}`;e.target.classList.toggle('active',flagMode);};
document.getElementById('newBtn').onclick=init;
document.getElementById('rBtn').onclick=init;
init();

</script>
</body>
</html>
