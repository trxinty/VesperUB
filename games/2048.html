<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>2048 · Vesper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#07050c;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas{display:block;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.28);max-width:100%;max-height:100%;}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,9,20,0.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:10;}
.hud span b{color:#c4b5fd;}
.overlay{position:fixed;inset:0;background:rgba(6,4,10,0.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center;padding:24px;}
.overlay.hidden{display:none;}
.overlay h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#c4b5fd,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.overlay p{color:#a79ec0;max-width:360px;font-size:0.95rem;line-height:1.5;}
.btn{background:#8b5cf6;color:#fff;border:none;padding:12px 26px;border-radius:12px;font-size:0.95rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,0.4);transition:transform 0.14s,background 0.14s;}
.btn:hover{background:#7c3aed;transform:translateY(-1px);}
.btn.sec{background:#1b1429;border:1px solid rgba(255,255,255,0.14);box-shadow:none;}

    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#130e1d;padding:12px;border-radius:16px;border:1px solid rgba(139,92,246,0.3);width:min(90vw,390px);height:min(90vw,390px);box-shadow:0 20px 50px rgba(0,0,0,0.6);}
    .cell{border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(1.3rem,4.5vw,2rem);transition:transform 0.1s ease,background 0.12s ease;}
    .controls{margin-top:16px;display:flex;gap:10px;}
    </style>
</head>
<body>
<div class="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">0</b></span></div>
<div class="board" id="board"></div>
<div class="controls"><button class="btn sec" id="newBtn">New Game</button></div>
<div class="overlay hidden" id="ov"><h1>GAME OVER</h1><p id="ovTxt"></p><button class="btn" id="retryBtn">Play Again</button></div>
<script>

const COLORS={0:['#1e1630','transparent'],2:['#2e1f4d','#f5f3ff'],4:['#3f286b','#f5f3ff'],8:['#6d28d9','#fff'],16:['#7c3aed','#fff'],32:['#9333ea','#fff'],64:['#c026d3','#fff'],128:['#db2777','#fff'],256:['#e11d48','#fff'],512:['#ea580c','#fff'],1024:['#d97706','#fff'],2048:['#facc15','#09090b']};
let grid=[],score=0,best=+(localStorage.getItem('vg_2048_best')||0);
const board=document.getElementById('board'),scEl=document.getElementById('sc'),bsEl=document.getElementById('bs'),ov=document.getElementById('ov');
bsEl.textContent=best;

function init(){
  grid=Array.from({length:4},()=>Array(4).fill(0));
  score=0; ov.classList.add('hidden');
  addTile(); addTile(); draw();
}
function addTile(){
  const empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}
function draw(){
  scEl.textContent=score;
  if(score>best){best=score;localStorage.setItem('vg_2048_best',best);bsEl.textContent=best;}
  board.innerHTML='';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const v=grid[r][c];
    const [bg,fg]=COLORS[v]||['#facc15','#09090b'];
    const d=document.createElement('div'); d.className='cell';
    d.style.background=bg; d.style.color=fg; d.textContent=v||'';
    board.appendChild(d);
  }
}
function slide(row){
  let arr=row.filter(v=>v);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); }
  }
  while(arr.length<4)arr.push(0);
  return arr;
}
function move(dir){
  const prev=JSON.stringify(grid);
  if(dir==='L') for(let r=0;r<4;r++) grid[r]=slide(grid[r]);
  if(dir==='R') for(let r=0;r<4;r++) grid[r]=slide(grid[r].slice().reverse()).reverse();
  if(dir==='U'){
    for(let c=0;c<4;c++){
      const col=slide([grid[0][c],grid[1][c],grid[2][c],grid[3][c]]);
      for(let r=0;r<4;r++)grid[r][c]=col[r];
    }
  }
  if(dir==='D'){
    for(let c=0;c<4;c++){
      const col=slide([grid[3][c],grid[2][c],grid[1][c],grid[0][c]]).reverse();
      for(let r=0;r<4;r++)grid[r][c]=col[r];
    }
  }
  if(JSON.stringify(grid)!==prev){ addTile(); draw(); checkOver(); }
}
function checkOver(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(!grid[r][c])return;
    if(r<3&&grid[r][c]===grid[r+1][c])return;
    if(c<3&&grid[r][c]===grid[r][c+1])return;
  }
  document.getElementById('ovTxt').textContent=`Final Score: ${score} · Best: ${best}`;
  ov.classList.remove('hidden');
}
window.addEventListener('keydown',e=>{
  const m={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D'}[e.code];
  if(m){e.preventDefault();move(m);}
});
let sx=0,sy=0;
board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
board.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));
});
document.getElementById('newBtn').onclick=init;
document.getElementById('retryBtn').onclick=init;
init();

</script>
</body>
</html>
