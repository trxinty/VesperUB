<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Star Blaster · Vesper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#07050c;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas{display:block;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.28);max-width:100%;max-height:100%;}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,9,20,0.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:10;}
.hud span b{color:#c4b5fd;}
.overlay{position:fixed;inset:0;background:rgba(6,4,10,0.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center;padding:24px;}
.overlay.hidden{display:none;}
.overlay h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#c4b5fd,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.overlay p{color:#a79ec0;max-width:360px;font-size:0.95rem;line-height:1.5;}
.btn{background:#8b5cf6;color:#fff;border:none;padding:12px 26px;border-radius:12px;font-size:0.95rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,0.4);transition:transform 0.14s,background 0.14s;}
.btn:hover{background:#7c3aed;transform:translateY(-1px);}
.btn.sec{background:#1b1429;border:1px solid rgba(255,255,255,0.14);box-shadow:none;}
</style>
</head>
<body>
<div class="hud"><span>Score <b id="sc">0</b></span><span>Wave <b id="wv">1</b></span><span>HP <b id="hp">3</b></span></div>
<canvas id="c" width="600" height="540"></canvas>
<div class="overlay" id="ov"><h1>STAR BLASTER</h1><p>Move with <strong>Mouse / Touch / Arrows</strong>. Auto-fire plasma cannons to survive alien waves!</p><button class="btn" id="sbtn">Launch Ship</button></div>
<script>

const c=document.getElementById('c'),ctx=c.getContext('2d'),ov=document.getElementById('ov');
let run=false,score=0,wave=1,hp=3,ship={x:300,y:475},bullets=[],enemies=[],stars=[],tick=0,keys={};
for(let i=0;i<60;i++) stars.push({x:Math.random()*c.width,y:Math.random()*c.height,s:1+Math.random()*2});

function start(){ run=true; score=0; wave=1; hp=3; ship={x:300,y:475}; bullets=[]; enemies=[]; tick=0; sync(); ov.classList.add('hidden'); }
function sync(){ document.getElementById('sc').textContent=score; document.getElementById('wv').textContent=wave; document.getElementById('hp').textContent=hp; }
window.addEventListener('keydown',e=>keys[e.code]=true);
window.addEventListener('keyup',e=>keys[e.code]=false);
c.addEventListener('pointermove',e=>{ if(!run)return; const r=c.getBoundingClientRect(); ship.x=Math.max(24,Math.min(c.width-24,(e.clientX-r.left)*(c.width/r.width))); });
document.getElementById('sbtn').onclick=start;

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle='#06040c'; ctx.fillRect(0,0,c.width,c.height);
  stars.forEach(s=>{ s.y+=s.s*0.9; if(s.y>c.height){s.y=0;s.x=Math.random()*c.width;} ctx.fillStyle='rgba(216,180,254,0.5)'; ctx.fillRect(s.x,s.y,s.s,s.s); });

  if(run){
    tick++;
    if(keys.ArrowLeft||keys.KeyA) ship.x=Math.max(24,ship.x-6.5);
    if(keys.ArrowRight||keys.KeyD) ship.x=Math.min(c.width-24,ship.x+6.5);
    if(tick%9===0) bullets.push({x:ship.x,y:ship.y-20});
    wave=1+Math.floor(score/250);
    if(tick%Math.max(16,46-wave*4)===0){
      const tough=Math.random()<0.25;
      enemies.push({x:30+Math.random()*(c.width-60),y:-24,hp:tough?3:1,r:tough?22:15,vy:1.8+wave*0.35});
    }
    for(let i=bullets.length-1;i>=0;i--){ bullets[i].y-=10; if(bullets[i].y<-10) bullets.splice(i,1); }
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i]; e.y+=e.vy;
      if(e.y>c.height+20 || Math.hypot(e.x-ship.x,e.y-ship.y)<e.r+16){
        enemies.splice(i,1); hp--; sync();
        if(hp<=0){ run=false; ov.querySelector('h1').textContent='SHIP DESTROYED'; ov.querySelector('p').textContent=`Score: ${score} · Reached Wave ${wave}`; document.getElementById('sbtn').textContent='Relaunch'; ov.classList.remove('hidden'); }
        continue;
      }
      for(let j=bullets.length-1;j>=0;j--){
        if(Math.hypot(e.x-bullets[j].x,e.y-bullets[j].y)<e.r+6){
          bullets.splice(j,1); e.hp--;
          if(e.hp<=0){ enemies.splice(i,1); score+=25; sync(); }
          break;
        }
      }
    }
  }

  bullets.forEach(b=>{ ctx.fillStyle='#38bdf8'; ctx.fillRect(b.x-2.5,b.y-10,5,14); });
  enemies.forEach(e=>{
    ctx.fillStyle=e.hp>1?'#f97316':'#ef4444'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  });
  ctx.fillStyle='#c084fc'; ctx.shadowColor='#8b5cf6'; ctx.shadowBlur=16;
  ctx.beginPath(); ctx.moveTo(ship.x,ship.y-20); ctx.lineTo(ship.x-18,ship.y+16); ctx.lineTo(ship.x,ship.y+8); ctx.lineTo(ship.x+18,ship.y+16); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
}
loop();

</script>
</body>
</html>
