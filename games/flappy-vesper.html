<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Flappy Vesper · Vesper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#07050c;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas{display:block;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.28);max-width:100%;max-height:100%;}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,9,20,0.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:10;}
.hud span b{color:#c4b5fd;}
.overlay{position:fixed;inset:0;background:rgba(6,4,10,0.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center;padding:24px;}
.overlay.hidden{display:none;}
.overlay h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#c4b5fd,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.overlay p{color:#a79ec0;max-width:360px;font-size:0.95rem;line-height:1.5;}
.btn{background:#8b5cf6;color:#fff;border:none;padding:12px 26px;border-radius:12px;font-size:0.95rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,0.4);transition:transform 0.14s,background 0.14s;}
.btn:hover{background:#7c3aed;transform:translateY(-1px);}
.btn.sec{background:#1b1429;border:1px solid rgba(255,255,255,0.14);box-shadow:none;}
</style>
</head>
<body>
<div class="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">0</b></span></div>
<canvas id="c" width="440" height="580"></canvas>
<div class="overlay" id="ov"><h1>FLAPPY VESPER</h1><p>Tap, click, or press <strong>Space</strong> to flap through the neon pillars.</p><button class="btn" id="sbtn">Fly</button></div>
<script>

const c=document.getElementById('c'),ctx=c.getContext('2d'),ov=document.getElementById('ov');
const scEl=document.getElementById('sc'),bsEl=document.getElementById('bs');
let best=+(localStorage.getItem('vg_flappy_best')||0); bsEl.textContent=best;
let run=false,score=0,bird={x:110,y:260,vy:0,r:16},pipes=[],tick=0;

function start(){ run=true; score=0; bird={x:110,y:260,vy:-6.8,r:16}; pipes=[]; tick=0; scEl.textContent=0; ov.classList.add('hidden'); }
function flap(){ if(!run){start();return;} bird.vy=-7.6; }
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();flap();}});
c.addEventListener('pointerdown',e=>{e.preventDefault();flap();});
document.getElementById('sbtn').onclick=start;

function loop(){
  requestAnimationFrame(loop);
  const g=ctx.createLinearGradient(0,0,0,c.height);
  g.addColorStop(0,'#0b0618'); g.addColorStop(1,'#1e1038');
  ctx.fillStyle=g; ctx.fillRect(0,0,c.width,c.height);

  if(run){
    tick++;
    bird.vy+=0.38; bird.y+=bird.vy;
    if(tick%92===0){
      const gap=138, top=60+Math.random()*(c.height-gap-140);
      pipes.push({x:c.width+30,top,gap,passed:false});
    }
    for(let i=pipes.length-1;i>=0;i--){
      const p=pipes[i]; p.x-=3.2;
      if(!p.passed && p.x+58<bird.x){ p.passed=true; score++; scEl.textContent=score; }
      if(p.x<-70) pipes.splice(i,1);
      if(bird.x+bird.r-3>p.x && bird.x-bird.r+3<p.x+58){
        if(bird.y-bird.r+3<p.top || bird.y+bird.r-3>p.top+p.gap) over();
      }
    }
    if(bird.y<bird.r || bird.y>c.height-bird.r) over();
  }

  for(const p of pipes){
    ctx.fillStyle='#7c3aed'; ctx.strokeStyle='#d8b4fe'; ctx.lineWidth=2;
    ctx.fillRect(p.x,0,58,p.top); ctx.strokeRect(p.x,0,58,p.top);
    const botY=p.top+p.gap;
    ctx.fillRect(p.x,botY,58,c.height-botY); ctx.strokeRect(p.x,botY,58,c.height-botY);
  }
  ctx.save(); ctx.translate(bird.x,bird.y); ctx.rotate(Math.max(-0.5,Math.min(1.1,bird.vy*0.07)));
  ctx.fillStyle='#facc15'; ctx.shadowColor='#facc15'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#09090b'; ctx.beginPath(); ctx.arc(6,-4,3.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fb923c'; ctx.beginPath(); ctx.moveTo(12,-2); ctx.lineTo(22,2); ctx.lineTo(12,6); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function over(){
  run=false;
  if(score>best){best=score;localStorage.setItem('vg_flappy_best',best);bsEl.textContent=best;}
  ov.querySelector('h1').textContent='GAME OVER';
  ov.querySelector('p').innerHTML=`Score: <strong>${score}</strong> · Best: <strong>${best}</strong>`;
  document.getElementById('sbtn').textContent='Fly Again';
  ov.classList.remove('hidden');
}
loop();

</script>
</body>
</html>
