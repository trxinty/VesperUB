<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Cyber Dino · Vesper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;background:#07050c;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas{display:block;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(139,92,246,0.28);max-width:100%;max-height:100%;}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,9,20,0.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:10;}
.hud span b{color:#c4b5fd;}
.overlay{position:fixed;inset:0;background:rgba(6,4,10,0.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center;padding:24px;}
.overlay.hidden{display:none;}
.overlay h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#c4b5fd,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.overlay p{color:#a79ec0;max-width:360px;font-size:0.95rem;line-height:1.5;}
.btn{background:#8b5cf6;color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:0.9rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,0.35);transition:transform 0.14s,background 0.14s;}
.btn:hover{background:#7c3aed;transform:translateY(-1px);}
.btn.sec{background:#1b1429;border:1px solid rgba(255,255,255,0.14);box-shadow:none;}
.btn.active{background:#c084fc;color:#09060e;}
</style>
</head>
<body>
<div class="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">0</b></span></div>
<canvas id="c" width="820" height="340"></canvas>
<div class="overlay" id="ov"><h1>CYBER DINO</h1><p>Press <strong>Space / Up / Tap</strong> to jump over cacti and <strong>Down</strong> to duck under drones.</p><button class="btn" id="sbtn">Sprint</button></div>
<script>

const c=document.getElementById('c'),ctx=c.getContext('2d'),ov=document.getElementById('ov');
const G=275; let best=+(localStorage.getItem('vg_dino_best')||0); document.getElementById('bs').textContent=best;
let run=false,score=0,spd=6,dino={x:90,y:G-44,w:34,h:44,vy:0,duck:false},obs=[],spT=40;
function start(){ run=true; score=0; spd=6; dino={x:90,y:G-44,w:34,h:44,vy:0,duck:false}; obs=[]; spT=45; ov.classList.add('hidden'); }
function jump(){ if(!run){start();return;} if(dino.y>=G-dino.h-1){ dino.vy=-12.8; } }
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump();}
  if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();dino.duck=true;}
});
window.addEventListener('keyup',e=>{ if(['ArrowDown','KeyS'].includes(e.code)) dino.duck=false; });
c.addEventListener('pointerdown',jump);
document.getElementById('sbtn').onclick=start;

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle='#080510'; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#8b5cf6'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,G); ctx.lineTo(c.width,G); ctx.stroke();

  if(run){
    score+=0.2; spd=Math.min(13,6+score*0.004);
    document.getElementById('sc').textContent=Math.floor(score);
    dino.h=dino.duck&&dino.y>=G-45?24:44;
    dino.vy+=0.68; dino.y+=dino.vy;
    if(dino.y>G-dino.h){ dino.y=G-dino.h; dino.vy=0; }
    if(--spT<=0){
      const fly=score>80&&Math.random()<0.35;
      obs.push(fly?{x:c.width+30,y:G-56,w:38,h:22,fly:true}:{x:c.width+30,y:G-(34+Math.random()*18),w:24,h:44,fly:false});
      spT=Math.max(32,Math.floor(72-spd*2.8+Math.random()*32));
    }
    for(let i=obs.length-1;i>=0;i--){
      const o=obs[i]; o.x-=spd;
      if(o.x<-50){ obs.splice(i,1); continue; }
      if(dino.x+4<o.x+o.w && dino.x+dino.w-4>o.x && dino.y+4<o.y+o.h && dino.y+dino.h-4>o.y){
        run=false; const s=Math.floor(score);
        if(s>best){best=s;localStorage.setItem('vg_dino_best',best);document.getElementById('bs').textContent=best;}
        ov.querySelector('h1').textContent='GAME OVER';
        ov.querySelector('p').innerHTML=`Score: <strong>${s}</strong> · Best: <strong>${best}</strong>`;
        document.getElementById('sbtn').textContent='Run Again'; ov.classList.remove('hidden');
      }
    }
  }
  obs.forEach(o=>{
    ctx.fillStyle=o.fly?'#38bdf8':'#10b981';
    ctx.fillRect(o.x,o.y,o.w,o.h);
  });
  ctx.fillStyle='#c4b5fd'; ctx.fillRect(dino.x,dino.y,dino.w,dino.h);
  ctx.fillStyle='#09060e'; ctx.fillRect(dino.x+dino.w-10,dino.y+6,5,5);
}
loop();

</script>
</body>
</html>
